<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Fundo Arredondado -->
  <rect width="100" height="100" rx="24" fill="url(#gridGrad)" />
  
  <!-- Células de Palavras Cruzadas em Destaque -->
  <g filter="url(#glow)">
    <!-- Linha Superior -->
    <rect x="18" y="18" width="28" height="28" rx="6" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
    <text x="32" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">C</text>
    <text x="22" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="7" fill="#818cf8">1</text>

    <rect x="54" y="18" width="28" height="28" rx="6" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
    <text x="68" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="19" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">R</text>

    <!-- Linha Inferior Cruzando -->
    <rect x="18" y="54" width="28" height="28" rx="6" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
    <text x="32" y="74" font-family="system-ui, sans-serif" font-weight="900" font-size="19" fill="#a855f7" text-anchor="middle" dominant-baseline="middle">Z</text>

    <rect x="54" y="54" width="28" height="28" rx="6" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
    <text x="68" y="74" font-family="system-ui, sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">M</text>
  </g>
</svg>
